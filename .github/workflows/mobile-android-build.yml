name: Mobile Android Build

# 在 fork 内的 PR 上自动构建 Android Release APK，也支持合并后手动构建。
# fork 无需发布签名密钥：Android 签名插件在 MULTICA_RELEASE_* Gradle
# 属性缺失时回退到 debug keystore，产物仍可直接安装。
#
# `android/` 是被忽略的 Expo prebuild 产物，全新 checkout 中不存在，
# 因此这里显式执行 prebuild，而不是依赖需要设备或模拟器的 expo run:android。
#
# 触发通道：
# - push 到 main（路径过滤与 PR 一致）：构建 production APK，并发布两个
#   GitHub Release——滚动 Release（tag `mobile-android-latest`，整体替换，
#   免登录稳定直链）与版本化 Release（tag `mobile-android-v<版本>-b<构建号>`，
#   tag 携带 APK 版本号，供应用内「检查更新」解析对比）。每次构建在
#   Release 正文携带 commit / run 标识可追溯来源。
# - pull_request / workflow_dispatch：行为不变，产物仅上传为 Actions
#   artifact，不发布 Release。
#
# Release 发布只发生在 push 通道：`publish-release` 以 event/ref 为条件，
# PR（含 fork）路径既不运行该 job，也不会获得其 job 级 `contents: write`
# 提升（permissions 声明随被跳过的 job 一起不生效）。

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/mobile-android-build.yml"
  workflow_dispatch:
    inputs:
      app_env:
        description: "选择 APP_ENV 构建环境"
        required: false
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

# 三个触发通道各自成组：push 与 dispatch 原本都会落到 github.ref 的同组，
# push 通道引入后会把对方取消；PR 仍按 PR 号成组。组内取消语义不变——
# 连续 push 到 main 时只有最新一次构建会跑完并发布 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ${{ inputs.app_env || 'production' }}
    outputs:
      # APK 实际版本号，供 publish-release 生成带版本的 Release tag。
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches apps/mobile/android's Gradle 9.0 wrapper, which requires
          # JDK 17+.
          java-version: "17"

      - name: Install dependencies
        run: pnpm install

      # Re-applies app.config.ts (package name, icon, signing plugin) into a
      # fresh android/ every run — same rationale as apps/mobile's
      # scripts/ios-run.sh: `expo run:android` only prebuilds when the
      # native dir is missing, so an explicit prebuild is the only way to
      # guarantee the config plugins actually ran.
      - name: Prebuild Android project (${{ env.APP_ENV }})
        working-directory: apps/mobile
        run: pnpm exec dotenv -e .env.${{ env.APP_ENV }} -- cross-env APP_ENV=${{ env.APP_ENV }} expo prebuild -p android

      # Gradle 缓存必须在 prebuild 之后启用：`android/` 是 Expo prebuild
      # 产物且被 .gitignore 排除，全新 checkout 中不存在。setup-java@v4 内置
      # 的 `cache: gradle` 在安装 JDK 时就运行 gradle/actions/setup-gradle，
      # 此时 android/ 还没有，导致 "No file matched" 错误。拆成独立 step
      # 放在 prebuild 之后解决时序问题，同时使用 gradle/actions 的推荐
      # 方式（直接引用 action 而非 setup-java 的 cache 选项）。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # RUYI-80: DOM components（mermaid 渲染）经 expo export 的
          # split-chunks 路径会在 HTML 序列化时抛 "Asset not found:
          # __common-*.js"（@expo/cli 的 DOM bundle 资产清单缺共享 chunk，
          # export:embed 与 expo export 同路径）。本 app 只有一个 DOM 组件，
          # 分包没有收益，官方逃生口 EXPO_NO_BUNDLE_SPLITTING=1 直接绕开。
          EXPO_NO_BUNDLE_SPLITTING: "1"
        run: ./gradlew assembleRelease --no-daemon

      # 版本取自 prebuild 产物 build.gradle 的 versionName（app.config.ts
      # 的 version 经 Expo 写入），与 APK 内实际版本、应用内「检查更新」
      # 对比的版本同源；不取 package.json，避免两处漂移时 tag 与安装包
      # 版本不一致。解析为空直接失败，防止发布无版本的 tag。
      - name: Resolve app version
        id: version
        working-directory: apps/mobile/android
        run: |
          version=$(sed -n 's/^ *versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::versionName not found in apps/mobile/android/app/build.gradle"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multica-mobile-${{ env.APP_ENV }}-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 仅 push 到 main 时发布 GitHub Release。本 job 的 permissions 是整个
  # workflow 唯一的写权限提升点，且随 if 一起只作用于 push 通道。
  publish-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ROLLING_TAG: mobile-android-latest
      # 版本化 tag 携带 APK 版本号（x.y.z 三段，可被版本解析器提取）；
      # -b<run_number> 保证每次构建 tag 唯一，rerun 同一 run 时同 tag 重建。
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      VERSION_TAG: mobile-android-v${{ needs.build.outputs.app_version }}-b${{ github.run_number }}
      # 与 build job 上传的 artifact 名对应：push 通道固定 production。
      ARTIFACT_NAME: multica-mobile-production-release-apk
      # 资产名固定，直链才稳定；与 gradle 产物名解耦。
      APK_NAME: multica-mobile-production.apk
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: apk

      # 稳定直链要求资产名固定；gradle 产物名可能随构建配置变化，这里
      # 归一化，并在产物数量异常时直接失败而不是静默传错文件。
      - name: Normalize APK filename
        run: |
          count=$(find apk -maxdepth 1 -name '*.apk' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 APK in artifact '$ARTIFACT_NAME', found $count"
            exit 1
          fi
          mv "apk/$(find apk -maxdepth 1 -name '*.apk' -printf '%f')" "apk/$APK_NAME"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Automated production build of the Multica Android app from `main`.

          | | |
          |---|---|
          | Version | v${{ needs.build.outputs.app_version }} |
          | Commit | `${{ github.sha }}` |
          | Workflow run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | APP_ENV | production |

          Install: download `multica-mobile-production.apk` below — no GitHub sign-in required. Each push to `main` replaces this release with the newest build.
          EOF

      # 幂等替换：先删旧 Release（连同其 tag），再清掉可能残留的孤儿 tag，
      # 最后在触发本次构建的 commit 上重建。同一 tag 已存在不会导致失败。
      # 滚动 Release 维持固定 tag，既有免登录稳定直链不变。
      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$ROLLING_TAG" || true
          gh release create "$ROLLING_TAG" "apk/$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Multica Android (production) — build ${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest=false

      # 版本化 Release：tag 携带版本号，供应用内「检查更新」解析对比；
      # 同样 --latest=false，不抢占仓库级 latest（不影响服务端 release.yml
      # 的 semver Release）。删除重建仅发生在 rerun 同一 run 时（同 tag）。
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION_TAG" || true
          gh release create "$VERSION_TAG" "apk/$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Multica Android (production) v$APP_VERSION — build ${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest=false
