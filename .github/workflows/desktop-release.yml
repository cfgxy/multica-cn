name: Desktop Release

# Desktop packaging + GitHub Release for this fork.
#
# `release.yml`'s `desktop` job declares `needs: release`, and `release` is
# gated behind `if: github.repository_owner == 'multica-ai'`. On a fork that
# guard is false, `release` is skipped, and `desktop` is skipped with it — so a
# tag push here never produces a Desktop installer. This workflow owns the
# fork's Desktop pipeline instead of editing that upstream guard: it creates
# the GitHub Release itself and publishes the installers into it.
#
# Triggers:
#   - pushing a `vX.Y.Z` tag  → release named after the tag
#   - manual dispatch on a commit past a tag → prerelease named after
#     `git describe` (e.g. `v0.4.41-182-g0a76682d0`), so a build is available
#     without minting a version tag first.
#
# Publishing boundary: only the tag push channel may own a release named after
# a tag. A manual run whose HEAD sits exactly on a tag is refused, and neither
# channel writes into an existing release unless that release already points at
# the commit being built — see scripts/desktop-release-tag.sh.

on:
  push:
    tags:
      # Glob, not regex — the strict semver check happens in the `meta` job.
      - "v*.*.*"
      - "!v*-dirty*"
  workflow_dispatch:
    inputs:
      include_mac:
        description: >-
          Also build macOS installers. They are ad-hoc signed only (no Developer
          ID, no notarization), so they are uploaded as workflow artifacts and
          never attached to the Release.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # scripts/package.mjs derives the app version from `git describe
          # --tags`, so the full history and all tags must be present here and
          # in every build job below.
          fetch-depth: 0

      - name: Verify release-tag derivation
        run: bash scripts/desktop-release-tag.test.sh

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            bash scripts/desktop-release-tag.sh push "${GITHUB_REF_NAME}"
          else
            # Manual run: name the release after the same `git describe` value
            # that scripts/package.mjs bakes into the installers, so the
            # release tag and the artifact version always match. The second
            # argument is git's own answer to "is HEAD itself a tag" (empty when
            # it is not); the script refuses on it, so this channel can never
            # name the release a tag push owns.
            bash scripts/desktop-release-tag.sh dispatch \
              "$(git describe --tags --match 'v[0-9]*' --always --dirty)" \
              "$(git describe --tags --match 'v[0-9]*' --exact-match 2>/dev/null || true)"
          fi

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ steps.resolve.outputs.tag_name }}
          IS_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          if existing="$(gh release view "$TAG_NAME" --json targetCommitish,isPrerelease 2>/dev/null)"; then
            # A release under this name already exists. Reuse is only safe when
            # it points at the very commit being built; `targetCommitish` can
            # also be a branch name, in which case it never equals a SHA and
            # the guard below refuses — deliberately fail closed.
            release_commit="$(jq -r '.targetCommitish // ""' <<<"$existing")"
            release_prerelease="$(jq -r '.isPrerelease' <<<"$existing")"
            bash scripts/desktop-release-tag.sh verify-reuse \
              "$EVENT_NAME" "$TAG_NAME" "$release_commit" "$GITHUB_SHA" "$release_prerelease"
            exit 0
          fi
          # electron-builder's github publisher is configured with
          # `releaseType: release` (apps/desktop/electron-builder.yml), which
          # expects an already published release. Create it up front so the
          # per-platform uploads below have a stable target.
          prerelease_flag=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            --target "${GITHUB_SHA}" \
            --title "$TAG_NAME" \
            --notes "Multica Desktop ${TAG_NAME} — installers are attached below." \
            "${prerelease_flag[@]}"

  desktop:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Linux and Windows installers ship unsigned; the CLI carries the
          # trust boundary. Set CSC_LINK / CSC_KEY_PASSWORD in repo secrets to
          # enable Windows signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish always

      - name: Upload Desktop artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/dist
          if-no-files-found: error

  # macOS is opt-in and never attached to the Release: this repo has no Apple
  # Developer ID certificate or notarization credentials wired into CI, so the
  # only thing CI can produce is an ad-hoc signed build that Gatekeeper blocks
  # on other machines. Wiring CSC_LINK + CSC_KEY_PASSWORD + APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID would let this job publish too.
  desktop-mac:
    needs: meta
    if: github.event_name == 'workflow_dispatch' && inputs.include_mac
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (mac, unsigned)
        working-directory: apps/desktop
        env:
          # No Developer ID cert available: fall back to an ad-hoc signature.
          # package.mjs also disables notarization when APPLE_TEAM_ID is unset.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --mac --x64 --arm64 --publish never

      - name: Upload Desktop artifacts (mac, unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-unsigned
          path: apps/desktop/dist
          if-no-files-found: error
